# Render Blueprint: PostgreSQL + API + web app.
# Render > New > Blueprint > pick your repository. Render asks for the values marked "sync: false".
#
# Free resources are pinned for a college/demo deployment. Free web services sleep after inactivity,
# and the free Postgres database expires after 30 days. Upgrade the plans for continuous availability
# and long-term data retention.
#
# Full steps are in README.md ("Deploy on Render").

databases:
  - name: sentinelx-db
    plan: free # College/demo deployment; free Postgres expires after 30 days
    databaseName: sentinelx
    user: sentinelx

services:
  # ------------------------------------------------------------------ API
  - type: web
    name: sentinelx-api
    plan: free # Spins down after inactivity; suitable for demos
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelx-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_ADMIN_USERNAME
        value: admin
      - key: FIRST_ADMIN_EMAIL
        sync: false # your email address
      - key: FIRST_ADMIN_PASSWORD
        sync: false # 12+ characters, you will use it to sign in
      - key: CORS_ORIGINS
        sync: false # the web app's address, e.g. https://sentinelx-web.onrender.com
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: ENABLE_DOCS
        value: "false"
      - key: ENABLE_SIMULATOR
        value: "true"

  # ------------------------------------------------------------------ Web app
  - type: web
    name: sentinelx-web
    plan: free # Spins down after inactivity; suitable for demos
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /login
    envVars:
      - key: API_PUBLIC_URL
        sync: false # the API's address, e.g. https://sentinelx-api.onrender.com (no trailing slash)
